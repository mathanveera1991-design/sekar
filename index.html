<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskMaster | State-Driven To-Do App</title>
  <meta name="description" content="An interactive client-side To-Do List application featuring full CRUD, local storage persistence, filtering, and event delegation.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Screen reader live announcer -->
  <div id="live-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <main class="app-container" role="main">
    <!-- App Header -->
    <header class="app-header">
      <div class="app-title">
        <span>TaskMaster</span>
        <span class="app-title-badge">LocalStorage</span>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle theme mode" title="Toggle theme mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </header>

    <!-- Create Task Form -->
    <form class="task-form" id="task-form" autocomplete="off">
      <input 
        type="text" 
        id="task-input" 
        class="task-input" 
        placeholder="What needs to be accomplished?" 
        required 
        aria-label="New task title"
      >
      <button type="submit" class="btn btn-primary" id="add-btn">
        <span>Add</span>
      </button>
    </form>

    <!-- Filtering Toolbar -->
    <section class="toolbar" aria-label="Task filters and status">
      <div class="filter-group" role="tablist" aria-label="Task filters">
        <button type="button" class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
        <button type="button" class="filter-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
        <button type="button" class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
      </div>
      <span class="stats-counter" id="stats-counter">0 tasks remaining</span>
    </section>

    <!-- Task List -->
    <ul class="task-list" id="task-list" aria-label="Tasks list">
      <!-- Dynamically generated items -->
    </ul>

    <!-- Empty State -->
    <div class="empty-state" id="empty-state" style="display: none;">
      <div class="empty-state-icon" aria-hidden="true">📋</div>
      <p><strong>No tasks found in this view</strong></p>
      <p style="font-size: 0.85rem;">Add a new task above to stay organized!</p>
    </div>

    <!-- App Footer -->
    <footer class="app-footer">
      <span>Hint: Double click / click edit button to modify tasks</span>
      <button type="button" class="clear-completed-btn" id="clear-completed-btn">Clear Completed</button>
    </footer>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
